# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Conexión a Valkey (Memorystore for Valkey en GCP): circuit breaker por proveedor.
    rce.redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@rce.redis'
            - { prefix: 'rce:sesion:', ttl: 28800 }

# Credenciales de proveedores: en dev y test, las públicas de sus ambientes de
# prueba. En prod, ninguna (NoProviderCredentials) hasta la configuración por tenant.
when@dev:
    services:
        App\Integration\Payments\Contract\ProviderCredentialsInterface:
            alias: App\Integration\Payments\Infrastructure\Configuration\SandboxProviderCredentials

# Cola de encargos en GCP: Cloud Tasks toca el timbre y firma con OIDC.
# En dev y test: simulador local (LocalTaskQueue + contenedor "tasks") y token compartido.
when@prod:
    services:
        App\Integration\Messaging\Application\TaskQueueInterface:
            alias: App\Integration\Messaging\Infrastructure\Tasks\CloudTasksQueue
        App\Integration\Messaging\Application\TaskRequestVerifierInterface:
            alias: App\Integration\Messaging\Infrastructure\Tasks\GoogleOidcTaskVerifier

when@test:
    services:
        App\Integration\Payments\Contract\ProviderCredentialsInterface:
            alias: App\Integration\Payments\Infrastructure\Configuration\SandboxProviderCredentials
        # Público solo en test: todavía nadie lo usa y Symfony lo eliminaría del contenedor.
        App\Integration\Payments\Application\GatewayRegistry:
            autowire: true
            public: true
