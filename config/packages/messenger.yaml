framework:
    messenger:
        transports:
            # Bandeja de encargos en la base del tenant (outbox): se guarda en la misma
            # transacción que el cambio que lo origina. La procesa una tarea HTTP
            # (Cloud Tasks en GCP, el simulador en local), con reintentos propios.
            # Ver src/Integration/Messaging/CLAUDE.md.
            outbox: 'outbox://'
            sync: 'sync://'

        routing:
            'App\Integration\Messaging\Application\OutboxMessageInterface': outbox
