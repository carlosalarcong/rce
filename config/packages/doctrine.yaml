# Dos entity managers:
#  - default: base Main (registro de tenants, superadmin, catálogos nacionales).
#  - tenant:  base de cada centro. Hakam lo crea en su prepend(); aquí solo
#             agregamos los mappings de cada módulo (ver docs/adr/0002).
doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                mappings:
                    PlatformTenancyMain:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Platform/Tenancy/Infrastructure/Doctrine/Entity'
                        prefix: 'App\Platform\Tenancy\Infrastructure\Doctrine\Entity'
                    # Cuentas (ADR 0005): entidades en Domain, mapeo XML en Infrastructure.
                    PlatformIdentityMain:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Platform/Identity/Infrastructure/Doctrine/Mapping'
                        prefix: 'App\Platform\Identity\Domain'
            tenant:
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                # Mappings de módulos (XML en Infrastructure/, entidades en Domain/).
                # Se agregan uno por submódulo a medida que se crean.
                mappings: []

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    # "TEST_TOKEN" is typically set by ParaTest
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                tenant:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
