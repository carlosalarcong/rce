# Reglas 1 y 2 del CLAUDE.md: las dependencias entre módulos van solo hacia abajo.
#   Ambulatory | Inpatient | PublicSector -> Clinical -> Platform
#   Integration -> Clinical, Platform
#   Ambulatory | Inpatient -> IntegrationApi (solo Contract/ y Application/ de Integration: el "menú";
#                             nunca los adaptadores ni el dominio de Integration)
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Kernel\.php$#'
  layers:
    - name: Platform
      collectors: [{ type: directory, value: src/Platform/.* }]
    - name: IntegrationApi
      collectors: [{ type: directory, value: 'src/Integration/[^/]+/(Contract|Application)/.*' }]
    - name: Integration
      collectors:
        - type: bool
          must:
            - { type: directory, value: src/Integration/.* }
          must_not:
            - { type: directory, value: 'src/Integration/[^/]+/(Contract|Application)/.*' }
    - name: Clinical
      collectors: [{ type: directory, value: src/Clinical/.* }]
    - name: Ambulatory
      collectors: [{ type: directory, value: src/Ambulatory/.* }]
    - name: Inpatient
      collectors: [{ type: directory, value: src/Inpatient/.* }]
    - name: PublicSector
      collectors: [{ type: directory, value: src/PublicSector/.* }]
  ruleset:
    Platform: ~
    Clinical: [Platform]
    IntegrationApi: [Integration, Clinical, Platform]
    Integration: [IntegrationApi, Clinical, Platform]
    Ambulatory: [IntegrationApi, Clinical, Platform]
    Inpatient: [IntegrationApi, Clinical, Platform]
    PublicSector: [Clinical, Platform]
