services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/app
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-8180}:80"  # no usar 8090: lo ocupa el agente del POS de Transbank
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Simulador de Cloud Tasks + Cloud Scheduler para la cola de encargos. En GCP no existe:
  # lo hacen Cloud Tasks (llama a /_tasks/outbox/...) y Cloud Scheduler (llama a /_tasks/sweep cada minuto).
  tasks:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    command: ["php", "bin/console", "rce:tasks:local-runner"]
    volumes:
      - ./:/var/www/app
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
      redis:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rce_main}
      POSTGRES_USER: ${POSTGRES_USER:-rce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rce}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-rce}", "-d", "${POSTGRES_DB:-rce_main}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql

  # Valkey: locks de cobro y circuit breaker por proveedor. En producción es Memorystore for Valkey (GCP);
  # aquí la misma versión (9.1, la que GCP usa por defecto). Al cambiarla, cambiar también la de Memorystore.
  redis:
    image: valkey/valkey:9.1-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bandeja de correos de prueba: atrapa lo que el RCE envía en desarrollo (recuperar
  # contraseña, invitaciones). Se ve en http://localhost:8025. Nada sale a internet.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  database_data:
