services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/app
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rce_main}
      POSTGRES_USER: ${POSTGRES_USER:-rce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rce}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-rce}", "-d", "${POSTGRES_DB:-rce_main}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql

  # Valkey: locks de cobro y circuit breaker por proveedor. En producción es Memorystore for Valkey (GCP);
  # aquí la misma versión (9.1, la que GCP usa por defecto). Al cambiarla, cambiar también la de Memorystore.
  redis:
    image: valkey/valkey:9.1-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
